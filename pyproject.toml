[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-bioinspirados"
version = "0.1.0"
description = "Laboratorio docente: algoritmos bioinspirados desacoplados (Problemas / Solvers / Vista). Fase 1: TSP + fuerza bruta."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
